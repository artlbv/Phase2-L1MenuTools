# TEST, NOT OFFICIAL: experimental tau taggers on HLT jets (hltJetTauTagTEST,
# configs/V50nano/objects/test_tautag.yaml; README.md in this folder). Run only with
#   --version V50nano_170pre6HLT_TESTtautag
# (the cache version holding the tagger object; outputs go to outputs/<that version>/).
# hltHpsPFTau is stored only if an L1 tau seed fired: the HPS efficiencies are L1 x HLT-like.
# Decay-mode split of test_tautag_trigger_wMatching.yaml (`split_by`, docs/object-performance.md), HH -> bbtautau.
# One plot per tagger (BDT / DeepSets / DeepSets alpha = 0.1, all 3 WPs each) and region, plot names
# TESTTau..._<BDT|DS|DSA>_DM. Per test object: the inclusive curve and one curve per generator decay
# mode of the visible gen tau (GenVisTau_status: 0 = 1-prong, 1 / 2 = 1-prong + 1 / 2 pi0,
# 10 = 3-prong, 11 = 3-prong + 1 pi0; 15 = other, only in the inclusive curve), and a fractions
# JSON with the efficiencies integrated over summary_range. Generated from test_tautag_trigger_wMatching.yaml; keep in sync.

TESTTauTriggerBarrel_BDT_wMatching_DM:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: true
  matching_and_threshold: true
  reference_object:
    object: GenVisTau
    x_arg: pt
    label: Gen Taus
    cuts:
      event:
      - abs({eta}) < 1.5
      object:
      - abs({eta}) < 2.1
  test_objects:
    L1nnPuppiTau:default:barrel: pt
    hltHpsPFTau:MediumDeepTau:barrel: pt
    hltJetTauTagTEST:BDT1kHz:barrel: pt
    hltJetTauTagTEST:BDTEff90:barrel: pt
    hltJetTauTagTEST:BDTEff80:barrel: pt
  thresholds:
  - 27
  - 35
  xlabel: Gen. $p_T$ (GeV)
  ylabel: Matching + Trigger Efficiency (barrel, $p_T > <threshold>$ GeV) [TEST]
  binning:
    min: 0
    max: 150
    step: 6
  split_by:
    field: status
    name: ''
    categories:
      1-prong:
      - 0
      1-prong + $\pi^0$s:
      - 1
      - 2
      3-prong:
      - 10
      3-prong + $\pi^0$:
      - 11
    summary_range:
    - 70
    - 150
