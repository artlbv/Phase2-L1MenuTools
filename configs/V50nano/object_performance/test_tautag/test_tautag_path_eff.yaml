# TEST, NOT OFFICIAL: experimental tau taggers on HLT jets (hltJetTauTagTEST,
# configs/V50nano/objects/test_tautag.yaml; README.md in this folder). Run only with
#   --version V50nano_170pre6HLT_TESTtautag
# The *_1kHz plots also hold the HLT ParT path emulated at 1 kHz (HLT_EMU_* bits of the v2 HLTEMU
# record): only with --version V50nano_170pre6HLTv2_TESTtautag (scripts/part/make_test_v2.py).
# Path level, HH -> bbtautau and DY (path_efficiency `paths:` map, as path_eff_taus_compare.yaml):
# per-event efficiency of the HLT double-tau paths with the L1 seed L1_pDoublePuppiTau52_52
# (HPS + DeepTau HLT_DoubleMediumDeepTauPFTauHPS35_eta2p1; ParticleTransformer on AK4 PUPPI jets
# HLT_DoubleMediumPFPuppiParTTauh30_eta2p1) and of emulated tagger paths HLT_TEST_* = the L1 seed
# AND >= 2 tagger candidates with |eta| < 2.1, pT > thr, score > cut, dR > 0.5 between two of them
# (per-event bits in <version>_<sample>_HLTTEST.parquet, written by
# scripts/test_tautag/emulate_paths.py; cuts and rates in emulated_paths.csv). Threshold on pT^sig,
# or *Reg: on the DeepSets regressed pT, *Jet: on the corrected AK4 jet pT (as ParT).
# ParTRate*: cuts at the ParT-path rate (11 of the 2M minimum-bias events) at 30 GeV like ParT;
#   ParTRatePtDef compares the pT definitions.
# 1kHz: the 1 kHz WPs at 35 GeV (26 GeV regressed), compared with DeepTau (66 events).
# Legend rates: minimum-bias events of the 2M (MinBiasL1Pass, 15.5 Hz each).
# Every plot is also split by the decay-mode pair of the two leading taus (split_by objects: 2).
# TESTDiTauPathDY_*: DYLL_M50 (no b jets), GenVisTau with pT > 25 GeV (cached later,
# configs/V50nano/cache_objects/caching_170pre6_HLT_DYgen.yaml); few events above 60 GeV.
# Paired counts against ParT / DeepTau and the jet composition: scripts/test_tautag/path_diagnosis.py.

TESTDiTauPath_ParTRate_VsSubleadPt:
  sample: HHTo2B2Tau
  version: V50nano
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen visible taus, $|\\eta| < 2.1$"
    rank: 2
    cuts:
      object:
        - "abs({eta}) < 2.1"
  path_efficiency:
    paths:
      ParT:
        L1: [L1_pDoublePuppiTau52_52_final]
        HLT: [HLT_DoubleMediumPFPuppiParTTauh30_eta2p1]
        curves: [L1, L1_and_HLT]
        labels:
          L1: "L1 DoublePuppiTau52_52 (20.28 kHz, 1306 ev.)"
          L1_and_HLT: "ParT Tauh30 (0.17 kHz, 11 ev.)"
      BDT_ParT_30:
        L1: [L1_pDoublePuppiTau52_52_final]
        HLT: [HLT_TEST_DoubleBDT_ParT_30]
        curves: [L1_and_HLT]
        labels:
          L1_and_HLT: "TEST BDT > 0.808, $p_T^{sig}$ > 30 (0.17 kHz, 11 ev.)"
      DS_ParT_30:
        L1: [L1_pDoublePuppiTau52_52_final]
        HLT: [HLT_TEST_DoubleDS_ParT_30]
        curves: [L1_and_HLT]
        labels:
          L1_and_HLT: "TEST DeepSets > 0.919, $p_T^{sig}$ > 30 (0.17 kHz, 11 ev.)"
      DSA_ParT_30:
        L1: [L1_pDoublePuppiTau52_52_final]
        HLT: [HLT_TEST_DoubleDSA_ParT_30]
        curves: [L1_and_HLT]
        labels:
          L1_and_HLT: "TEST DeepSets $\\alpha$=0.1 > 0.860, $p_T^{sig}$ > 30 (0.17 kHz, 11 ev.)"
    plateau_min: 80
  split_by:
    field: status
    objects: 2
    categories:
      "1-prong": [0, 1, 2]
      "3-prong": [10, 11]
    name: DMpair
    layout: per_category
    summary_range: [80, 200]
  xlabel: "Subleading gen visible tau $p_T$ (GeV)"
  ylabel: "Efficiency [TEST]"
  binning:
    edges: [0, 10, 20, 30, 35, 40, 45, 50, 60, 70, 80, 100, 150, 200]

