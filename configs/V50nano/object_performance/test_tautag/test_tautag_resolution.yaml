# TEST, NOT OFFICIAL: experimental tau taggers on HLT jets (hltJetTauTagTEST,
# configs/V50nano/objects/test_tautag.yaml; README.md in this folder). Run only with
#   --version V50nano_170pre6HLT_TESTtautag
# (the cache version holding the tagger object; outputs go to outputs/<that version>/).
# hltHpsPFTau is stored only if an L1 tau seed fired: the HPS efficiencies are L1 x HLT-like;
# the HLT-jet taggers are not (the jets are stored in every event).
# Response / resolution of the tau pT estimates: pT^sig of the HLT-jet candidates (no ID),
# HPS, L1 NN PUPPI tau, HH -> bbtautau.

TESTTauResolutionBarrel:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltJetTauTagTEST:noID: "pt"
    hltHpsPFTau:default: "pt"
    L1nnPuppiTau:default: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [20, 30, 40, 50, 60, 80, 100, 150]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 3, step: 0.04}

TESTTauResolutionEndcap:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) > 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    hltJetTauTagTEST:noID: "pt"
    hltHpsPFTau:default: "pt"
    L1nnPuppiTau:default: "pt"
  resolution:
    variables: [pt, eta, phi]
    vs:
      pt: {edges: [20, 30, 40, 50, 60, 80, 100, 150]}
      pu: {edges: [150, 180, 190, 200, 210, 220, 260]}
    response_binning:
      pt: {min: 0, max: 3, step: 0.04}
