# TEST, NOT OFFICIAL: experimental tau taggers on HLT jets (hltJetTauTagTEST,
# configs/V50nano/objects/test_tautag.yaml; README.md in this folder). Run only with
#   --version V50nano_170pre6HLT_TESTtautag
# (the cache version holding the tagger object; outputs go to outputs/<that version>/).
# hltHpsPFTau is stored only if an L1 tau seed fired: the HPS efficiencies are L1 x HLT-like;
# the HLT-jet taggers are not (the jets are stored in every event).
# Matching + Trigger Efficiency vs gen visible tau pT, HH -> bbtautau. The tagger thresholds are on pT^sig.

TESTTauTriggerBarrel_wMatching:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  matching_and_threshold: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    L1nnPuppiTau:default:barrel: "pt"
    hltHpsPFTau:MediumDeepTau:barrel: "pt"
    hltJetTauTagTEST:noID:barrel: "pt"
    hltJetTauTagTEST:BDT1kHz:barrel: "pt"
    hltJetTauTagTEST:DS1kHz:barrel: "pt"
    hltJetTauTagTEST:DSA1kHz:barrel: "pt"
  thresholds: [27, 35]
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching + Trigger Efficiency (barrel, $p_T > <threshold>$ GeV) [TEST]"
  binning:
    min: 0
    max: 150
    step: 6

TESTTauTriggerEndcap_wMatching:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  matching_and_threshold: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) > 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    L1nnPuppiTau:default:endcap: "pt"
    hltHpsPFTau:MediumDeepTau:endcap: "pt"
    hltJetTauTagTEST:noID:endcap: "pt"
    hltJetTauTagTEST:BDT1kHz:endcap: "pt"
    hltJetTauTagTEST:DS1kHz:endcap: "pt"
    hltJetTauTagTEST:DSA1kHz:endcap: "pt"
  thresholds: [27, 35]
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching + Trigger Efficiency (endcap, $p_T > <threshold>$ GeV) [TEST]"
  binning:
    min: 0
    max: 150
    step: 6
