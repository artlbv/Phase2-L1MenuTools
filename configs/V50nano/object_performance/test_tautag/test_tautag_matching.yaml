# TEST, NOT OFFICIAL: experimental tau taggers on HLT jets (hltJetTauTagTEST,
# configs/V50nano/objects/test_tautag.yaml; README.md in this folder). Run only with
#   --version V50nano_170pre6HLT_TESTtautag
# or, with the HLT ParT (hltAK4PuppiJetParT, p2nano v2), only with
#   --version V50nano_170pre6HLTv2_TESTtautag  (scripts/part/make_test_v2.py)
# (the cache version holding the tagger object; outputs go to outputs/<that version>/).
# hltHpsPFTau is stored only if an L1 tau seed fired: the HPS efficiencies are L1 x HLT-like;
# the HLT-jet taggers are not (the jets are stored in every event).
# Matching efficiency vs gen visible tau pT (GenVisTau, |eta| < 2.1), HH -> bbtautau.

TESTTauMatchingBarrel:
  sample: HHTo2B2Tau
  version: V50nano
  match_test_to_ref: True
  reference_object:
    object: "GenVisTau"
    x_arg: "pt"
    label: "Gen Taus"
    cuts:
      event:
        - "abs({eta}) < 1.5"
      object:
        - "abs({eta}) < 2.1"
  test_objects:
    L1nnPuppiTau:default: "pt"
    hltHpsPFTau:default: "pt"
    hltHpsPFTau:MediumDeepTau: "pt"
    hltJetTauTagTEST:noID: "pt"
    hltJetTauTagTEST:BDT1kHz: "pt"
    hltJetTauTagTEST:DS1kHz: "pt"
    hltJetTauTagTEST:DSA1kHz: "pt"
    hltAK4PuppiJetParT:MediumParT: "pt"
    hltAK4PuppiJetParT:ParT1kHz: "pt"
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching Efficiency (barrel) [TEST]"
  binning:
    min: 0
    max: 150
    step: 6

